<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi 🎨</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,700;1,700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #180800;
    overflow: hidden;
    height: 100vh; width: 100vw;
    cursor: crosshair;
    touch-action: none;
  }
  canvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

  .center {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 10; pointer-events: none;
    width: 92vw; max-width: 660px;
    padding: 16px 32px;
  }

  /* message font size is the base — ~1rem */
  .message {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(0.78rem, 2vw, 0.95rem);
    color: rgba(255, 240, 210, 0.88);
    line-height: 1.8;
    font-weight: 600;
    letter-spacing: 0.02em;
    opacity: 0;
    animation: fadeUp 1s ease forwards 2.1s;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    padding: 0 0.5rem;
  }
  .message span {
    display: block;
    margin-top: 0.45rem;
    color: rgba(255, 225, 160, 0.82);
    font-weight: 400;
  }

  /* Happy & Holi = ~4.5x message size */
  .letter {
    display: inline-block;
    font-family: 'Crimson Text', serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 9vw, 4.5rem); /* ~4.5× the ~1rem message */
    opacity: 0;
    overflow: visible;
    animation: letterReveal 0.65s ease forwards;
    padding: 0 1px;
    line-height: 1.15;
  }

  /* "Happy" — italic, warm gradient */
  .word-happy .letter {
    font-style: italic;
    background: linear-gradient(150deg, #ffcc70 0%, #ff7043 55%, #f06292 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* "Holi" — upright bold, rainbow gradient */
  .word-holi .letter {
    font-style: normal;
    background: linear-gradient(150deg, #ff6b6b 0%, #ffd93d 30%, #6bcb77 60%, #4d96ff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: letterReveal 0.65s ease forwards, gradShift 6s ease infinite;
  }

  @keyframes letterReveal {
    0%   { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes gradShift {
    0%,100% { background-position: 0%   50%; }
    50%      { background-position: 100% 50%; }
  }

  .word-line {
    display: block;
    overflow: visible;
    padding: 2px 8px;
    line-height: 1.2;
  }

  .divider {
    margin: 0.75rem auto 0.7rem;
    width: 0; height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,200,120,0.6), transparent);
    animation: expandLine 0.8s ease forwards 1.95s;
  }
  @keyframes expandLine {
    from { width: 0;    opacity: 0; }
    to   { width: 60px; opacity: 1; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .click-hint {
    position: fixed; bottom: 1.8rem; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-family: 'Nunito', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    animation: pulse 2.5s ease infinite;
    z-index: 10; white-space: nowrap;
  }
  @keyframes pulse { 0%,100%{opacity:0.22;} 50%{opacity:0.62;} }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="center">
  <div class="word-line word-happy" id="happy"></div>
  <div class="word-line word-holi"  id="holi"></div>
  <div class="divider"></div>
  <div class="message">
    May this festival of colors fill your life with<br>happiness, positivity, and new opportunities.
    <span>May your days be as bright as the colors of Holi<br>and your heart be filled with joy and success.</span>
  </div>
</div>

<div class="click-hint">Tap or swipe to throw gulal</div>

<script>
function buildWord(id, text, baseDelay, perDelay) {
  const el = document.getElementById(id);
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'letter';
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.animationDelay = (baseDelay + i * perDelay) + 's';
    el.appendChild(s);
  });
}

buildWord('happy', 'Happy', 0.1,  0.08);
buildWord('holi',  'Holi',  0.58, 0.1);

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', { alpha: false });
let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;

const PALETTES = [
  [220,28,80],[255,68,20],[240,190,0],
  [22,150,50],[20,80,200],[148,30,190],
  [230,40,110],[255,120,0],
];

const MAX=1800;
const px=new Float32Array(MAX),py=new Float32Array(MAX);
const pvx=new Float32Array(MAX),pvy=new Float32Array(MAX);
const palpha=new Float32Array(MAX),pdecay=new Float32Array(MAX);
const pr=new Float32Array(MAX),prh=new Float32Array(MAX),prot=new Float32Array(MAX);
const pcr=new Uint8Array(MAX),pcg=new Uint8Array(MAX),pcb=new Uint8Array(MAX);
const pactive=new Uint8Array(MAX);
let head=0;

function spawnParticle(x,y,col,isClick){
  const i=head++%MAX;
  pactive[i]=1; px[i]=x; py[i]=y;
  pcr[i]=col[0]; pcg[i]=col[1]; pcb[i]=col[2];
  const speed=isClick?Math.random()*10+3:Math.random()*3.5+0.5;
  const angle=Math.random()*Math.PI*2;
  pvx[i]=Math.cos(angle)*speed;
  pvy[i]=Math.sin(angle)*speed-(isClick?Math.random()*6+2:Math.random()*2.5);
  const base=isClick?Math.random()*4+1.5:Math.random()*2.5+0.8;
  pr[i]=base; prh[i]=base*(Math.random()*0.5+0.3);
  prot[i]=Math.random()*Math.PI;
  palpha[i]=Math.random()*0.35+0.65;
  pdecay[i]=isClick?Math.random()*0.018+0.008:Math.random()*0.012+0.004;
}

const MAX_PUFF=300;
const ux=new Float32Array(MAX_PUFF),uy=new Float32Array(MAX_PUFF);
const uvx=new Float32Array(MAX_PUFF),uvy=new Float32Array(MAX_PUFF);
const ur=new Float32Array(MAX_PUFF),ugrow=new Float32Array(MAX_PUFF);
const ualpha=new Float32Array(MAX_PUFF),udecay=new Float32Array(MAX_PUFF);
const ucr=new Uint8Array(MAX_PUFF),ucg=new Uint8Array(MAX_PUFF),ucb=new Uint8Array(MAX_PUFF);
const uactive=new Uint8Array(MAX_PUFF);
let uhead=0;

function spawnPuff(x,y,col){
  const i=uhead++%MAX_PUFF;
  uactive[i]=1;
  ux[i]=x+(Math.random()-0.5)*18; uy[i]=y+(Math.random()-0.5)*18;
  uvx[i]=(Math.random()-0.5)*2.5; uvy[i]=-(Math.random()*2+0.8);
  ur[i]=Math.random()*20+10; ugrow[i]=Math.random()*1.2+0.5;
  ualpha[i]=Math.random()*0.22+0.1; udecay[i]=Math.random()*0.007+0.003;
  ucr[i]=col[0]; ucg[i]=col[1]; ucb[i]=col[2];
}

function randomPalette(){ return PALETTES[Math.random()*PALETTES.length|0]; }

function throwGulal(x,y,count,isClick){
  const col=randomPalette(),col2=randomPalette();
  for(let i=0;i<count;i++) spawnParticle(x,y,i%4===0?col2:col,isClick);
  for(let i=0;i<(isClick?5:2);i++) spawnPuff(x,y,col);
}

let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min((ts-last)/16.67,3); last=ts;
  ctx.fillStyle='rgba(24,8,0,0.18)';
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<MAX_PUFF;i++){
    if(!uactive[i]) continue;
    ux[i]+=uvx[i]*dt; uy[i]+=uvy[i]*dt;
    uvy[i]+=0.04*dt; ur[i]+=ugrow[i]*dt;
    ualpha[i]-=udecay[i]*dt;
    if(ualpha[i]<=0){uactive[i]=0;continue;}
    const r=ucr[i],g=ucg[i],b=ucb[i],rad=ur[i];
    const grd=ctx.createRadialGradient(ux[i],uy[i],0,ux[i],uy[i],rad);
    grd.addColorStop(0,`rgba(${r},${g},${b},${(ualpha[i]*0.45).toFixed(2)})`);
    grd.addColorStop(0.6,`rgba(${r},${g},${b},${(ualpha[i]*0.15).toFixed(2)})`);
    grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath(); ctx.arc(ux[i],uy[i],rad,0,Math.PI*2);
    ctx.fillStyle=grd; ctx.fill();
  }

  for(let i=0;i<MAX;i++){
    if(!pactive[i]) continue;
    px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt;
    pvy[i]+=0.26*dt; pvx[i]*=Math.pow(0.97,dt);
    palpha[i]-=pdecay[i]*dt;
    if(palpha[i]<=0){pactive[i]=0;continue;}
    ctx.save();
    ctx.globalAlpha=palpha[i];
    ctx.translate(px[i]|0,py[i]|0);
    ctx.rotate(prot[i]);
    ctx.fillStyle=`rgb(${pcr[i]},${pcg[i]},${pcb[i]})`;
    ctx.beginPath();
    ctx.ellipse(0,0,pr[i],prh[i],0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

setInterval(()=>throwGulal(Math.random()*W,Math.random()*H*0.8,22,false),800);
setTimeout(()=>{ for(let i=0;i<6;i++) setTimeout(()=>throwGulal(Math.random()*W,Math.random()*H*0.75,28,false),i*120); },400);

canvas.addEventListener('click',(e)=>throwGulal(e.clientX,e.clientY,55,true));

const lastTouch={};
canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    throwGulal(t.clientX,t.clientY,55,true);
    lastTouch[t.identifier]={x:t.clientX,y:t.clientY};
  }
},{passive:false});
canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const prev=lastTouch[t.identifier]; if(!prev) continue;
    const dx=t.clientX-prev.x,dy=t.clientY-prev.y;
    if(dx*dx+dy*dy>144){
      throwGulal(t.clientX,t.clientY,14,false);
      lastTouch[t.identifier]={x:t.clientX,y:t.clientY};
    }
  }
},{passive:false});
canvas.addEventListener('touchend',(e)=>{ for(const t of e.changedTouches) delete lastTouch[t.identifier]; });

let mc=0;
canvas.addEventListener('mousemove',(e)=>{ if(++mc%5!==0) return; throwGulal(e.clientX,e.clientY,5,false); });
window.addEventListener('resize',()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; });
requestAnimationFrame(frame);
</script>
</body>
</html>
